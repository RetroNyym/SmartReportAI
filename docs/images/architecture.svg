<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E78"/>
    </marker>
  </defs>
  <rect width="1100" height="260" fill="#FFFFFF"/>
  <text x="550" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F4E78">SmartReportAI: Veriden Karara Akış</text>

  <g>
    <rect x="20" y="90" width="150" height="80" rx="10" fill="#F2F6FA" stroke="#1F4E78" stroke-width="2"/>
    <text x="95" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F4E78">Veritabanı</text>
    <text x="95" y="144" text-anchor="middle" font-size="11" fill="#333">SQL Server, MySQL,</text>
    <text x="95" y="160" text-anchor="middle" font-size="11" fill="#333">PostgreSQL, SQLite</text>
  </g>

  <g>
    <rect x="210" y="90" width="150" height="80" rx="10" fill="#F2F6FA" stroke="#1F4E78" stroke-width="2"/>
    <text x="285" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F4E78">Query Manager</text>
    <text x="285" y="144" text-anchor="middle" font-size="11" fill="#333">reports.yaml</text>
    <text x="285" y="160" text-anchor="middle" font-size="11" fill="#333">queries/*.sql</text>
  </g>

  <g>
    <rect x="400" y="90" width="150" height="80" rx="10" fill="#F2F6FA" stroke="#1F4E78" stroke-width="2"/>
    <text x="475" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F4E78">Insight Engine</text>
    <text x="475" y="144" text-anchor="middle" font-size="11" fill="#333">Trend, artış/düşüş,</text>
    <text x="475" y="160" text-anchor="middle" font-size="11" fill="#333">zirve tespiti</text>
  </g>

  <g>
    <rect x="590" y="90" width="150" height="80" rx="10" fill="#F2F6FA" stroke="#1F4E78" stroke-width="2"/>
    <text x="665" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F4E78">AI Özet</text>
    <text x="665" y="144" text-anchor="middle" font-size="11" fill="#333">Yönetici odaklı</text>
    <text x="665" y="160" text-anchor="middle" font-size="11" fill="#333">Türkçe analiz</text>
  </g>

  <g>
    <rect x="780" y="90" width="130" height="80" rx="10" fill="#F2F6FA" stroke="#1F4E78" stroke-width="2"/>
    <text x="845" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F4E78">Excel + PDF</text>
    <text x="845" y="144" text-anchor="middle" font-size="11" fill="#333">Grafik ve tablo</text>
    <text x="845" y="160" text-anchor="middle" font-size="11" fill="#333">dahil rapor</text>
  </g>

  <g>
    <rect x="950" y="90" width="130" height="80" rx="10" fill="#1F4E78" stroke="#1F4E78" stroke-width="2"/>
    <text x="1015" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Outlook</text>
    <text x="1015" y="144" text-anchor="middle" font-size="11" fill="#FFFFFF">HTML şablonlu</text>
    <text x="1015" y="160" text-anchor="middle" font-size="11" fill="#FFFFFF">e-posta</text>
  </g>

  <g stroke="#1F4E78" stroke-width="2" marker-end="url(#arrow)">
    <line x1="172" y1="130" x2="208" y2="130"/>
    <line x1="362" y1="130" x2="398" y2="130"/>
    <line x1="552" y1="130" x2="588" y2="130"/>
    <line x1="742" y1="130" x2="778" y2="130"/>
    <line x1="912" y1="130" x2="948" y2="130"/>
  </g>

  <text x="550" y="220" text-anchor="middle" font-size="12" fill="#666">Tek komutla çalışır: python main.py --send</text>
